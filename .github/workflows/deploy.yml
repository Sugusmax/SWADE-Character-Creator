name: Build Android Release (Capacitor)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Configurar Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 4. Instalar dependencias web
        run: npm install --legacy-peer-deps

      - name: 5. Compilar proyecto web con Vite
        run: npx vite build

      - name: 6. Agregar plataforma Android y ajustar SDK a 24
        run: |
          npx cap add android || true
          if [ -f "android/variables.gradle" ]; then
            sed -i 's/minSdkVersion = 23/minSdkVersion = 24/g' android/variables.gradle
          fi
          npx cap sync android

      - name: 7. Dar permisos de ejecución a Gradle
        run: chmod +x android/gradlew

      - name: 8. Compilar Android App Bundle (.aab)
        run: |
          cd android
          ./gradlew bundleRelease

      - name: 9. Generar firma y firmar el archivo .aab
        run: |
          # Crear una clave keystore en la nube
          keytool -genkey -v -keystore release.keystore -alias swade-key -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=SWADE, OU=Dev, O=SWADE, L=City, S=State, C=AR"
          
          # Firmar el bundle
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.keystore -storepass 123456 -keypass 123456 android/app/build/outputs/bundle/release/app-release.aab swade-key

      - name: 10. Subir .aab firmado como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: android/app/build/outputs/bundle/release/app-release.aab
