name: Build Android Release (Capacitor)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Configurar Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 4. Instalar dependencias web
        run: npm install --legacy-peer-deps

      - name: 5. Compilar proyecto web con Vite
        run: npx vite build

      - name: 6. Agregar plataforma Android y ajustar SDK a 24
        run: |
          npx cap add android || true
          if [ -f "android/variables.gradle" ]; then
            sed -i 's/minSdkVersion = 23/minSdkVersion = 24/g' android/variables.gradle
          fi
          npx cap sync android

      - name: 7. Decodificar Keystore de producción
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: 8. Dar permisos de ejecución a Gradle
        run: chmod +x android/gradlew

      - name: 9. Compilar Android App Bundle (.aab)
        run: |
          cd android
          ./gradlew bundleRelease

      - name: 10. Firmar el archivo .aab con la clave correcta
        run: |
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore release.keystore \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            android/app/build/outputs/bundle/release/app-release.aab \
            "${{ secrets.KEY_ALIAS }}"

      - name: 11. Subir .aab firmado como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: android/app/build/outputs/bundle/release/app-release.aab
